plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oneline'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 기존 Node 서버와 같은 SQLite 파일(data/1line.db)을 그대로 사용한다.
    implementation 'org.xerial:sqlite-jdbc:3.53.2.0'
    // 활동 유형 정렬을 Node(ICU)의 localeCompare(b, 'ko')와 같게 맞춘다.
    implementation 'com.ibm.icu:icu4j:77.1'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// Windows(한국어)에서 프로젝트 경로에 한글이 있으면(예: 바탕화면\1호선톤) Gradle 테스트 워커의
// 클래스패스 인자 파일이 MS949로 잘못 읽혀 테스트 클래스를 찾지 못한다.
// 이때만 컴파일된 클래스를 ASCII 임시 경로로 복사해 테스트를 실행한다. (빌드 결과 위치는 그대로)
def nonAsciiPath = !projectDir.absolutePath.chars().allMatch { it < 128 }
if (nonAsciiPath) {
    def asciiRoot = new File(System.getProperty('java.io.tmpdir'), "1line-api-server-test-${projectDir.absolutePath.hashCode().abs()}")
    def syncTestClasspath = tasks.register('syncTestClasspath', Sync) {
        from(sourceSets.main.output) { into 'main' }
        from(sourceSets.test.output) { into 'test' }
        into asciiRoot
    }
    tasks.named('test') {
        dependsOn syncTestClasspath
        testClassesDirs = files(new File(asciiRoot, 'test'))
        classpath = files(new File(asciiRoot, 'test'), new File(asciiRoot, 'main')) +
                sourceSets.test.runtimeClasspath.filter { !it.absolutePath.startsWith(layout.buildDirectory.get().asFile.absolutePath) }
    }
}

tasks.named('bootRun') {
    // 기존 Node 서버와 같은 기준 경로(api-server 폴더)에서 상대 경로를 해석할 수 있게 프로젝트 폴더에서 실행한다.
    workingDir = projectDir
}
